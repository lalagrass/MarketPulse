    first_noted: 2026-09-03
    source: podcast
    source_ref: 股癌 EP693
    stance: confirming
    stage: mapped
    revisit: 2026-10-01
    revisit_note: 若 optical_cpo 主題 rank 跌出前 3 則提前重評

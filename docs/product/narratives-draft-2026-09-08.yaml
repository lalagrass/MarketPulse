    named_symbols: ["2330"]
    inferred_symbols: []
    note: >
      記憶體控制器由運算晶片移入 HBM base die，HBM4 世代 base die 規劃由台積電
      以先進製程代工。posts/20260908 的 High-NA EUV 三大客戶量產年份是同一條
      「先進製程價值上移」的線。
    branches:
      - branch_id: hbm4_base_die_tsmc
        claim: HBM4 base die 由台積電先進製程代工，價值往代工端移轉
        baskets:
          if_true: ["2330"]
          if_false: ["2408", "2344", "2337"]   # 記憶體原廠自己做 base die
          either_way: [semiconductor_test, high_speed_materials]
        watch: 台積電法說是否確認 HBM base die 訂單；記憶體三雄 HBM4 時程

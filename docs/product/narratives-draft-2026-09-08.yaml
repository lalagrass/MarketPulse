# 草稿 — 規劃端填的三籃，交 PO 逐格審核後才搬進 narratives/。
#
# 為什麼是草稿而不是直接寫進 narratives/：籃子成員是 PO 的判斷，
# 規劃端只寫 docs/。審過之後：
#   cp docs/product/narratives-draft-2026-09-08.yaml narratives/2026-09-08.yaml
#
# 來源：docs/podcasts/EP693、EP694 與 docs/posts/ 四則貼文。
# 代號一律取自 themes/v1.yaml 已有的 65 檔（外加 2454，它本來就在 named_symbols）。
#
# 規劃端在填的時候撞到一件事，寫在最下面 —— 先看它再看內容。

snapshot_date: 2026-09-08

narratives:
  - narrative_id: asic_xpu
    name: 客製化 ASIC / XPU
    first_noted: 2026-09-03
    source: podcast
    source_ref: 股癌 EP693
    stance: new
    stage: open
    revisit: 2026-10-15
    revisit_note: 或 Broadcom 下一次財報電話會議，以先到者為準
    named_symbols: ["2454"]
    inferred_symbols: []
    note: >
      聯發科 39 億美元 ECB，輝達認購 35 億、票息 0%、溢價約 15%，Alphabet 亦參與。
      EP694：Hock Tan 首度正面點名聯發科為競爭對手。
      反向證據（posts/20260903）：同一場法說說 Broadcom v8i 已出貨、領先更早啟動的
      MediaTek v8t，且 TPU 成本不到 GPU 一半。兩個方向目前都只存在 note 裡。
    branches:
      - branch_id: mediatek_asic_share
        claim: 聯發科在雲端客製 ASIC 拿到實質份額
        baskets:
          if_true: ["2454"]
          if_false: []          # 台股買不到 Broadcom 的對立面，見文末
          either_way: [foundry_advanced, semiconductor_test]
        watch: 下一季 Broadcom／NVDA 法說是否再點名；聯發科法說是否單獨揭露 ASIC 營收
        status: live
      - branch_id: xpu_not_squeezing_gpu
        claim: XPU 興起擴大整體 TAM，未壓縮 GPU 廠
        baskets:
          if_true: ["2382", "3231", "6669"]
          if_false: []          # 同上
          either_way: [foundry_advanced, thermal, ai_power]
        watch: NVDA 資料中心毛利率；機櫃互聯／網通／儲存方案營收占比
        status: live
    log:
      - date: 2026-09-05
        source_ref: 股癌 EP694
        kind: evidence
        text: >
          Broadcom FY 電話會議：Hock Tan 首度正面點名聯發科為真正的競爭對手。
          同場提到六大客製晶片客戶中 Anthropic 與 OpenAI 信評較弱，
          Broadcom 與 NVIDIA 均出手協助確保硬體開出。
        bears_on: [mediatek_asic_share, xpu_not_squeezing_gpu]


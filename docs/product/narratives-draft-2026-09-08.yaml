        source_ref: 股癌 EP694
        kind: evidence
        text: >
          Broadcom 在 Fabric、光通訊與互聯架構的 Guidance 給得極佳，屬對既有強勢的
          同向確認，不帶新資訊。
        bears_on: []

  # ── 以下是規劃端提案的新故事，PO 沒點頭之前不算數 ──────────────────
  - narrative_id: memory_passthrough
    name: 記憶體／NAND 漲價轉嫁得動
    first_noted: 2026-09-07
    source: post
    source_ref: 股癌臉書貼文 2026-09-07（NTAP 27Q1）
    stance: new
    stage: open
    revisit: 2026-10-12
    revisit_note: 台廠 9 月月營收公布（每月 10 日前後）；下一輪美系儲存法說
    named_symbols: []
    inferred_symbols: []
    note: >
      NTAP 法說：下游全部照買、還願意備庫存；漲價反映從 2–3 季縮短到當季；
      高優先 AI 工作負載即使漲價照買，低優先才延後或從全快閃降級為混合快閃。
      這是目前唯一一條台股兩邊都買得到的故事。
    branches:
      - branch_id: nand_price_passthrough
        claim: 記憶體漲價轉嫁得動，漲價的一方吃到價差、用料的一方吸收成本
        baskets:
          if_true: ["2337", "2344", "2408", "8299", "3260"]
          if_false: ["2382", "3231", "6669", "2324", "2356"]
          either_way: [semiconductor_test]
        watch: 記憶體廠與整機廠的月營收與毛利率方向是否背離
        status: live
    log:
      - date: 2026-09-07
        source_ref: 股癌臉書貼文 2026-09-07
        kind: claim
        text: >
          過去成本大漲客戶會縮，這次所有客戶都繼續衝；企業儲存廠對終端有定價權，
          成本得以順利轉嫁下游。
        bears_on: [nand_price_passthrough]

# ── 規劃端填的時候撞到的事，比上面的內容重要 ────────────────────────
#
# **themes/v1.yaml 這 65 檔是照「AI 供應鏈受惠者」建的，裡面沒有對立面。**
# 所以 asic_xpu 的兩條支線 if_false 只能留空——台股買不到 Broadcom，
# 也沒有「XPU 沒吃到 GPU」的純標的。這不是漏填，是宇宙的形狀。
#
# 填得出兩邊的只有兩條，而且都是同一個原因：對立雙方剛好都在既有主題裡——
#   nvhbm            台積電 ←→ 記憶體三雄
#   memory_passthrough  記憶體廠 ←→ 整機廠
#
# 這件事對 015 的意義：
#   (1) 三籃能不能運作，取決於宇宙裡有沒有對立面，不取決於 schema。
#   (2) 「if_false 留空」要當成一個可以印出來的狀態——「這個對立在台股不可交易」，
#       那本身對讀的人有用，不是缺資料。
#   (3) 要讓更多故事填得出兩邊，得擴 themes/v1.yaml 或允許籃子放主題外的代號。
#       前者會動到第一層的每一個數字（凍結成分股），後者不會。**傾向後者。**

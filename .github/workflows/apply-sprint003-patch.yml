name: apply-sprint003-patch
on:
  workflow_dispatch:
  push:
    branches: [sprint/003-uncertainty]
    paths: [scratch/sprint003_rest.patch.gz.b64]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/003-uncertainty
      - name: Decode apply commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f scratch/sprint003_rest.patch.gz.b64
          base64 -d scratch/sprint003_rest.patch.gz.b64 | gunzip | git apply --index
          git status
          git commit -m "feat: sprint 003 DO-1/2/3 code (null baseline, backfill, smoke)" || echo nochange
          git push origin HEAD:sprint/003-uncertainty

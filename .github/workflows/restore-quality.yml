name: restore-quality
on:
  push:
    branches: [sprint/003-uncertainty]
    paths: ['scratch/quality.py.zlib.b64']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/003-uncertainty
      - name: Restore quality.py
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          import base64, zlib, pathlib
          b64 = pathlib.Path('scratch/quality.py.zlib.b64').read_text().strip()
          raw = zlib.decompress(base64.b64decode(b64))
          pathlib.Path('marketpulse/quality.py').write_bytes(raw)
          assert b'write_null_baseline' in raw
          print('restored', len(raw))
          PY
          git add marketpulse/quality.py
          git commit -m "fix: restore marketpulse/quality.py (DO-1)"
          git push origin HEAD:sprint/003-uncertainty
